<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | FableYatra</title>

  <!-- SEO Meta -->
  <meta name="description" content="Contact FableYatra — Propose stories, folklore legends, and collaborations." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/profile/FableYatra-profile-800.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Starry Background -->
  <canvas id="starfield"></canvas>
  <div class="ambient-glow ambient-glow-1"></div>
  <div class="ambient-glow ambient-glow-2"></div>

  <!-- Contact Container -->
  <main class="contact-container">
    
    <!-- Top Nav Bar -->
    <div class="contact-nav-bar">
      <a href="index.html" class="back-home-btn">
        <i class="bi bi-arrow-left"></i> Home
      </a>
      <a href="index.html">
        <img src="assets/logo/FableYatra-lockup-horizontal.png" alt="FableYatra" style="height: 36px; width: auto;" />
      </a>
    </div>

    <!-- Header Text -->
    <header style="margin-bottom: 1.5rem;">
      <h1 style="font-family: var(--font-heading); font-size: 2rem; color: var(--color-sunlight); margin-bottom: 0.4rem;">
        Get in Touch ✨
      </h1>
      <p style="font-size: 0.95rem; color: var(--color-text-muted);">
        Have a folklore tale suggestion, voiceover inquiry, or feedback? Send a message below:
      </p>
    </header>

    <!-- Embedded Google Form -->
    <div class="form-embed-card">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdnMZnLtWyyyNS_5YNbc4etpjSVYreRx6Pxnd2v-vD7Jun_gw/viewform?embedded=true" width="100%" height="850" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    </div>

    <!-- Footer -->
    <footer class="creator-footer">
      <p>© 2026 FableYatra · Developed by <a href="https://kotakcloud.github.io/" target="_blank" rel="noopener noreferrer">kotakcloud</a></p>
    </footer>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
